[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parentlog"
version = "0.1.0"
description = "家校沟通记录 CSV 一键生成 A4 纵向可打印记录表"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["parentlog", "home-school", "teacher", "education", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
parentlog = "parentlog.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/parentlog"
Source = "https://github.com/eastyou/parentlog"

[tool.setuptools]
packages = ["parentlog"]
