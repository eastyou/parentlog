name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test example generation
        run: |
          python -m parentlog -i examples/沟通记录.csv --title 三年级一班家校沟通记录 -o examples/家校沟通记录.html
          python -c "from pathlib import Path; page = Path('examples/家校沟通记录.html').read_text(encoding='utf-8'); assert '三年级一班家校沟通记录' in page; assert '共 14 条记录' in page; assert '第 2 / 2 页' in page; assert 'A4 portrait' in page"
      - name: Smoke test student filter
        run: |
          python -m parentlog -i examples/沟通记录.csv --student 张三 -o parentlog-filtered.html
          python -c "from pathlib import Path; page = Path('parentlog-filtered.html').read_text(encoding='utf-8'); assert '共 4 条记录' in page; assert '涉及 1 名学生' in page; assert '反馈语文作业完成质量' not in page"
